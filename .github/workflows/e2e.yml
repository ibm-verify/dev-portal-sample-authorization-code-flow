name: CI

on:
  push:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Docker image
        run: docker build -t auth-code-app .

      - name: Start container
        run: |
          docker run -d --name auth-code-app \
            -p 3000:3000 \
            -e TENANT_URL="${{ secrets.TENANT_URL }}" \
            -e CLIENT_ID="${{ secrets.CLIENT_ID }}" \
            -e CLIENT_SECRET="${{ secrets.CLIENT_SECRET }}" \
            -e REDIRECT_URI="http://localhost:3000/callback" \
            -e RESPONSE_TYPE="code" \
            -e SCOPE="openid" \
            auth-code-app

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000; then
              echo "App is ready"
              exit 0
            fi
            echo "Attempt $i/15 — waiting 2s..."
            sleep 2
          done
          echo "App did not become ready in time"
          exit 1

      - name: Dump container logs on failure
        if: failure()
        run: docker logs auth-code-app

      - name: Clean up
        if: always()
        run: |
          docker stop auth-code-app || true
          docker rm   auth-code-app || true

  e2e:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright + Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Docker image
        run: docker build -t auth-code-app .

      - name: Start container
        run: |
          docker run -d --name auth-code-app \
            -p 3000:3000 \
            -e TENANT_URL="${{ secrets.TENANT_URL }}" \
            -e CLIENT_ID="${{ secrets.CLIENT_ID }}" \
            -e CLIENT_SECRET="${{ secrets.CLIENT_SECRET }}" \
            -e REDIRECT_URI="http://localhost:3000/callback" \
            -e RESPONSE_TYPE="code" \
            -e SCOPE="openid" \
            auth-code-app

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000; then
              echo "App is ready"
              exit 0
            fi
            echo "Attempt $i/30 — waiting 2s..."
            sleep 2
          done
          echo "App did not become ready in time"
          exit 1

      - name: Run Playwright E2E tests
        env:
          APP_URL: "http://localhost:3000"
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npm test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: |
          docker stop auth-code-app || true
          docker rm   auth-code-app || true
